name: Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pacman contribution graph
        uses: Ileriayo/pacman-contribution-graph@v1
        with:
          github_user_name: UdayrajRastogi-Dev
          theme: classic
          output_file_name: pacman-contribution-graph.svg

      - name: Push generated file
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
